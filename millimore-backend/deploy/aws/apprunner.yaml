# AWS App Runner config (alternative to ECS/Copilot).
# Simplest container hosting — but note App Runner's WebSocket support is limited;
# for the realtime /v1/ws features use ECS Fargate + ALB (copilot-manifest.yml).
# App Runner is fine if you only need the REST API + admin at first.
version: 1.0
runtime: nodejs18
build:
  commands:
    build:
      - npm ci --include=dev
      - npx prisma generate
      - npm run build
      - (cd admin && npm ci --include=dev && npm run build)
run:
  runtime-version: 22
  command: node dist/main.js
  network:
    port: 3000
  env:
    - name: NODE_ENV
      value: production
    - name: API_PREFIX
      value: v1
  # Set DATABASE_URL, JWT_SECRET, CREDENTIAL_ENCRYPTION_KEY, REDIS_URL as
  # runtime secrets in the App Runner console (from Secrets Manager/SSM).
