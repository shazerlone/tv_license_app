<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Sitegap{% endblock %} · Sitegap</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<div class="topbar">
  <div class="wrap">
    <a class="brand" href="{{ url_for('dashboard') }}"><span class="dot"></span> Sitegap</a>
    <nav class="nav">
      <a href="{{ url_for('dashboard') }}" class="{{ 'active' if nav=='dashboard' }}">Dashboard</a>
      <a href="{{ url_for('leads') }}" class="{{ 'active' if nav=='leads' }}">Lead Queue</a>
      <a href="{{ url_for('leads', tier='A') }}" class="{{ 'active' if nav=='tierA' }}">Tier A</a>
    </nav>
  </div>
</div>
<main class="wrap">
  {% block body %}{% endblock %}
</main>
<div class="foot wrap">
  Sitegap — Lead Finder → Quotation → Pitch Pack ·
  Google Places data is subject to caching/display terms · Outreach templates carry a TDRA opt-out line by design.
</div>
