workflows:
  android-test:
    name: Millimore Android (test)
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: mobile
    environment:
      flutter: stable
    scripts:
      - name: Regenerate native platform folders
        script: |
          rm -rf android ios
          flutter create --platforms=android,ios --org com.millimore --project-name millimore .
      - name: Inject camera & mic permissions
        script: |
          python3 -c 'import re,pathlib; p=pathlib.Path("android/app/src/main/AndroidManifest.xml"); t=p.read_text(); perm="<uses-permission android:name=\"android.permission.CAMERA\"/><uses-permission android:name=\"android.permission.RECORD_AUDIO\"/><uses-permission android:name=\"android.permission.INTERNET\"/><uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"28\"/>"; p.write_text(t if "permission.CAMERA" in t else re.sub(r"(<manifest[^>]*>)", lambda m: m.group(1)+perm, t, count=1))'
          plutil -insert NSCameraUsageDescription -string "Camera is used to go live." ios/Runner/Info.plist || true
          plutil -insert NSMicrophoneUsageDescription -string "Microphone is used to go live." ios/Runner/Info.plist || true
          plutil -insert NSPhotoLibraryUsageDescription -string "Attach a chart or setup image to your posts." ios/Runner/Info.plist || true
          plutil -insert NSPhotoLibraryAddUsageDescription -string "Save deposit QR codes to your photos." ios/Runner/Info.plist || true
          cp firebase/google-services.json android/app/google-services.json || true
          # image_cropper needs UCropActivity declared in the app manifest.
          python3 -c 'import re,pathlib; p=pathlib.Path("android/app/src/main/AndroidManifest.xml"); t=p.read_text(); act="<activity android:name=\"com.yalantis.ucrop.UCropActivity\" android:screenOrientation=\"portrait\" android:theme=\"@style/Theme.AppCompat.Light.NoActionBar\"/>"; p.write_text(t if "UCropActivity" in t else re.sub(r"(</application>)", act+r"\1", t, count=1))'
      - name: Flutter packages get
        script: flutter pub get
      - name: Generate branded app icon
        script: dart run flutter_launcher_icons
      - name: Build debug APK
        script: flutter build apk --debug --dart-define=BUILD_SHA=${CM_COMMIT} --dart-define=BUILD_BRANCH=${CM_BRANCH}
    artifacts:
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - asrariamobicity35@gmail.com
        notify:
          success: true
          failure: true

  ios-testflight:
    name: Millimore iOS (TestFlight)
    max_build_duration: 90
    instance_type: mac_mini_m2
    working_directory: mobile
    # References the App Store Connect API key connected in Codemagic
    # (Team settings → Integrations → Apple Developer Portal). Name must match.
    integrations:
      app_store_connect: Millimore
    environment:
      flutter: stable
      # Xcode is the runner default (Xcode 26 / iOS 26 SDK, required by Apple).
      # No `ios_signing` block: that block fails at startup when no provisioning
      # profile exists yet. Instead the script below imports the distribution
      # certificate stored in Codemagic (millimore-dist, with its private key)
      # AND creates the App Store provisioning profile via the API key.
    scripts:
      - name: Regenerate native platform folders
        script: |
          rm -rf android ios
          flutter create --platforms=android,ios --org com.millimore --project-name millimore .
      - name: Inject camera & mic permissions
        script: |
          plutil -insert NSCameraUsageDescription -string "Camera is used to go live." ios/Runner/Info.plist || true
          plutil -insert NSMicrophoneUsageDescription -string "Microphone is used to go live." ios/Runner/Info.plist || true
          plutil -insert NSPhotoLibraryUsageDescription -string "Attach a chart or setup image to your posts." ios/Runner/Info.plist || true
          plutil -insert NSPhotoLibraryAddUsageDescription -string "Save deposit QR codes to your photos." ios/Runner/Info.plist || true
      - name: Configure Firebase push (iOS)
        script: |
          # Firebase config file (Dart options also cover init; this is the native backup).
          cp firebase/GoogleService-Info.plist ios/Runner/GoogleService-Info.plist || true
          # Background mode so pushes wake the app.
          plutil -insert UIBackgroundModes -array ios/Runner/Info.plist || true
          plutil -insert UIBackgroundModes.0 -string remote-notification ios/Runner/Info.plist || true
          # Push entitlement (requires Push Notifications enabled on the App ID
          # com.millimore.millimore in the Apple Developer portal, so the created
          # provisioning profile includes it).
          python3 -c 'import pathlib; pathlib.Path("ios/Runner/Runner.entitlements").write_text("<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">\n<plist version=\"1.0\"><dict>\n<key>aps-environment</key><string>production</string>\n</dict></plist>\n")'
          python3 -c 'import re,pathlib; p=pathlib.Path("ios/Runner.xcodeproj/project.pbxproj"); t=p.read_text(); t=t if "CODE_SIGN_ENTITLEMENTS" in t else re.sub(r"(PRODUCT_BUNDLE_IDENTIFIER = com\.millimore\.millimore;)", r"\1\n\t\t\t\tCODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;", t); p.write_text(t)'
      - name: Configure Firebase Phone Auth (iOS URL scheme)
        script: |
          # Firebase Phone Auth's reCAPTCHA fallback opens a Safari flow that
          # redirects back via a custom URL scheme = REVERSED_CLIENT_ID from the
          # GoogleService-Info.plist. Register it in Info.plist's CFBundleURLTypes.
          python3 - <<'PY'
          import plistlib, pathlib
          gsp = pathlib.Path("ios/Runner/GoogleService-Info.plist")
          info = pathlib.Path("ios/Runner/Info.plist")
          if gsp.exists():
              g = plistlib.loads(gsp.read_bytes())
              rev = g.get("REVERSED_CLIENT_ID")
              if rev:
                  d = plistlib.loads(info.read_bytes())
                  types = d.setdefault("CFBundleURLTypes", [])
                  if not any(rev in (t.get("CFBundleURLSchemes") or []) for t in types):
                      types.append({"CFBundleURLSchemes": [rev]})
                  info.write_bytes(plistlib.dumps(d))
                  print("Added REVERSED_CLIENT_ID URL scheme.")
              else:
                  print("No REVERSED_CLIENT_ID in GoogleService-Info.plist (phone auth may need it).")
          else:
              print("GoogleService-Info.plist missing; skipping URL scheme.")
          PY
      - name: Flutter packages get
        script: flutter pub get
      - name: Generate branded app icon
        script: dart run flutter_launcher_icons
      - name: Set up code signing
        script: |
          set -e
          keychain initialize
          # 0) SUSTAINABLE SIGNING FOR UNLIMITED REBUILDS.
          #    Each build mints a fresh distribution cert (its private key is
          #    generated here). Apple caps you at 2 active distribution certs, so
          #    without cleanup the ~3rd build fails with "maximum number of
          #    certificates". Fix: revoke the old distribution certs + delete the
          #    old App Store profiles first, so we stay permanently at 1 cert and
          #    can build any number of times. Guarded with `|| true` so a cleanup
          #    hiccup never fails the build.
          # Distribution certs come in two API types — DISTRIBUTION (Apple
          # Distribution) and IOS_DISTRIBUTION (legacy iOS Distribution). Revoke
          # BOTH so creating a fresh one never hits the "already have a current
          # Distribution certificate" 409. (single-line python — keeps YAML valid)
          for CT in DISTRIBUTION IOS_DISTRIBUTION; do app-store-connect certificates list --type "$CT" --json 2>/dev/null | python3 -c "import sys,json,subprocess; [subprocess.run(['app-store-connect','certificates','delete',c['id']],check=False) for c in (json.load(sys.stdin) or [])]" || true; done
          app-store-connect profiles list --type IOS_APP_STORE --json 2>/dev/null | python3 -c "import sys,json,subprocess; [subprocess.run(['app-store-connect','profiles','delete',p['id']],check=False) for p in (json.load(sys.stdin) or [])]" || true
          # 1) Generate a private key on THIS machine.
          openssl genrsa -out /tmp/millimore_cert_key.pem 2048
          # 2) Create the Apple Distribution certificate FROM that key (so the
          #    private key is local and can sign) + create the App Store profile.
          app-store-connect fetch-signing-files "com.millimore.millimore" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/millimore_cert_key.pem \
            --create
          keychain add-certificates
          xcode-project use-profiles
          echo "──────── signing identities in keychain (must show Apple Distribution) ────────"
          security find-identity -v -p codesigning
      - name: Build signed IPA
        script: |
          # Codemagic auto-increments $BUILD_NUMBER every run, so each TestFlight
          # upload has a unique, higher build number (Apple rejects duplicates).
          flutter build ipa --release \
            --build-number=${BUILD_NUMBER} \
            --dart-define=BUILD_SHA=${CM_COMMIT} \
            --dart-define=BUILD_BRANCH=${CM_BRANCH} \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - asrariamobicity35@gmail.com
        notify:
          success: true
          failure: true
