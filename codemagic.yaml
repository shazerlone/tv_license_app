workflows:
  android-test:
    name: Millimore Android (test)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Regenerate native platform folders
        script: |
          # The app was hand-authored (no flutter create), so android/ios are
          # incomplete. Regenerate them cleanly without touching lib/ or web/.
          rm -rf android ios
          flutter create --platforms=android,ios --org com.millimore --project-name millimore .
      - name: Inject camera & mic permissions
        script: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            /usr/bin/sed -i '' 's#<manifest\(.*\)>#<manifest\1>\
    <uses-permission android:name="android.permission.CAMERA"/>\
    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\
    <uses-permission android:name="android.permission.INTERNET"/>#' "$MANIFEST"
          fi
          plutil -insert NSCameraUsageDescription -string "Camera is used to go live." ios/Runner/Info.plist || true
          plutil -insert NSMicrophoneUsageDescription -string "Microphone is used to go live." ios/Runner/Info.plist || true
      - name: Flutter packages get
        script: flutter pub get
      - name: Build debug APK (installable, no signing needed)
        script: flutter build apk --debug
    artifacts:
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - asrariamobicity35@gmail.com
        notify:
          success: true
          failure: true

  ios-testflight:
    name: Millimore iOS (TestFlight)
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Regenerate native platform folders
        script: |
          rm -rf android ios
          flutter create --platforms=android,ios --org com.millimore --project-name millimore .
      - name: Inject camera & mic permissions
        script: |
          plutil -insert NSCameraUsageDescription -string "Camera is used to go live." ios/Runner/Info.plist || true
          plutil -insert NSMicrophoneUsageDescription -string "Microphone is used to go live." ios/Runner/Info.plist || true
      - name: Flutter packages get
        script: flutter pub get
      - name: Build iOS (unsigned until signing is configured)
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
    publishing:
      email:
        recipients:
          - asrariamobicity35@gmail.com
