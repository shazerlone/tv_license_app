workflows:
  android-test:
    name: Millimore Android (test)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Regenerate native platform folders
        script: |
          rm -rf android ios
          flutter create --platforms=android,ios --org com.millimore --project-name millimore .
      - name: Inject camera & mic permissions
        script: |
          python3 -c 'import re,pathlib; p=pathlib.Path("android/app/src/main/AndroidManifest.xml"); t=p.read_text(); perm="<uses-permission android:name=\"android.permission.CAMERA\"/><uses-permission android:name=\"android.permission.RECORD_AUDIO\"/><uses-permission android:name=\"android.permission.INTERNET\"/>"; p.write_text(t if "permission.CAMERA" in t else re.sub(r"(<manifest[^>]*>)", lambda m: m.group(1)+perm, t, count=1))'
          plutil -insert NSCameraUsageDescription -string "Camera is used to go live." ios/Runner/Info.plist || true
          plutil -insert NSMicrophoneUsageDescription -string "Microphone is used to go live." ios/Runner/Info.plist || true
      - name: Flutter packages get
        script: flutter pub get
      - name: Build debug APK
        script: flutter build apk --debug --dart-define=BUILD_SHA=${CM_COMMIT} --dart-define=BUILD_BRANCH=${CM_BRANCH}
    artifacts:
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - asrariamobicity35@gmail.com
        notify:
          success: true
          failure: true

  ios-testflight:
    name: Millimore iOS (TestFlight)
    max_build_duration: 90
    instance_type: mac_mini_m2
    # References the App Store Connect API key connected in Codemagic
    # (Team settings → Integrations → Apple Developer Portal). Name must match.
    integrations:
      app_store_connect: Millimore
    environment:
      flutter: stable
      # NOTE: no `ios_signing` block on purpose. That block makes Codemagic
      # try to FETCH an existing profile at startup and fail ("No matching
      # profiles found") for a brand-new bundle id. Instead we CREATE the
      # cert + profile in the "Set up code signing" script below.
    scripts:
      - name: Regenerate native platform folders
        script: |
          rm -rf android ios
          flutter create --platforms=android,ios --org com.millimore --project-name millimore .
      - name: Inject camera & mic permissions
        script: |
          plutil -insert NSCameraUsageDescription -string "Camera is used to go live." ios/Runner/Info.plist || true
          plutil -insert NSMicrophoneUsageDescription -string "Microphone is used to go live." ios/Runner/Info.plist || true
      - name: Flutter packages get
        script: flutter pub get
      - name: Set up code signing
        script: |
          set -x
          keychain initialize
          # 1) Create an Apple Distribution certificate WITH a private key on
          #    this machine. A cert made earlier on the web/Xcode has its private
          #    key elsewhere, so the build can't sign with it — generate a fresh
          #    one here. (If you hit a "maximum certificates" error, delete an
          #    old Apple Distribution cert in App Store Connect → Certificates.)
          app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --save
          # 2) Create/fetch the App Store provisioning profile for the bundle id.
          app-store-connect fetch-signing-files "com.millimore.millimore" \
            --type IOS_APP_STORE \
            --create
          # 3) Import the cert(s) into the build keychain, apply profiles to Xcode.
          keychain add-certificates
          xcode-project use-profiles
          # 4) DIAGNOSTIC — this must list at least one "Apple Distribution" identity.
          echo "──────── signing identities in keychain ────────"
          security find-identity -v -p codesigning || true
          echo "──────── provisioning profiles ────────"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || true
      - name: Build signed IPA
        script: |
          # Codemagic auto-increments $BUILD_NUMBER every run, so each TestFlight
          # upload has a unique, higher build number (Apple rejects duplicates).
          flutter build ipa --release \
            --build-number=${BUILD_NUMBER} \
            --dart-define=BUILD_SHA=${CM_COMMIT} \
            --dart-define=BUILD_BRANCH=${CM_BRANCH} \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - asrariamobicity35@gmail.com
        notify:
          success: true
          failure: true
