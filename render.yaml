# Render Blueprint — deploys the Millimore backend (millimore-backend/) on the
# free tier. Render reads this file from the repo root when you create a
# "New > Blueprint" from this GitHub repo.
#
# Free-tier notes:
#  - Web service sleeps after ~15 min idle and cold-starts on the next request
#    (first hit after sleep takes ~30-60s). Fine for integration/demo.
#  - Free Postgres is time-limited by Render (expires ~30 days after creation);
#    upgrade the database plan before then to keep data.
#  - Redis is NOT provisioned yet — milestone 1 doesn't use it. It gets added
#    here when the realtime milestones (prices/portfolio/chat) land.
services:
  - type: web
    name: millimore-backend
    runtime: node
    plan: free
    branch: claude/millimore-backend-admin-yl2ffz
    rootDir: millimore-backend
    # migrate deploy runs here because Render's free tier has no preDeploy hook.
    buildCommand: npm install && npm run prisma:generate && npm run build && npx prisma migrate deploy && npm run db:seed
    startCommand: node dist/main.js
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: v1
      # DB connection is injected from the managed Postgres below.
      - key: DATABASE_URL
        fromDatabase:
          name: millimore-db
          property: connectionString
      # Secrets Render generates once and keeps stable across deploys.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      # CryptoService hashes any string to a 32-byte AES key, so a generated
      # value is fine. Keep it stable — rotating it makes existing ciphertext
      # (encrypted credentials) undecryptable.
      - key: CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      # OTP in console mode: codes are logged + returned as `devCode` so the app
      # can log in without an SMS gateway. Swap to twilio/msg91 + OTP_PROVIDER_KEY
      # in the Render dashboard when you wire a real provider.
      - key: OTP_PROVIDER
        value: console
      - key: OTP_CODE_TTL_SECONDS
        value: '300'
      - key: OTP_CODE_LENGTH
        value: '6'
      # Allow the app + admin to call the API. Tighten to real origins later.
      - key: CORS_ORIGINS
        value: '*'

databases:
  - name: millimore-db
    plan: free
    databaseName: millimore
    user: millimore
