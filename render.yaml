# Render Blueprint — the WHOLE stack in one click: API + admin UI + Postgres +
# Redis. Render reads this file from the repo root ("New > Blueprint"), builds
# it, and re-deploys automatically on every git push. No servers/VPC/load
# balancers to configure — this is the simplest path.
#
# ─── To go "production" (no cold start, data kept), change 3 words ───
#  1. web service   plan: free  →  plan: starter     (~$7/mo, always on, no sleep)
#  2. database      plan: free  →  plan: basic-256mb (~$6/mo, kept beyond 30 days)
#  3. redis (below) plan: free  →  plan: starter     (optional, bigger/persisted)
# Leave them on `free` to run at $0 (the web service just sleeps ~15 min idle;
# the keep-warm GitHub Action softens that).
services:
  - type: web
    name: millimore-backend
    runtime: node
    plan: free
    branch: claude/millimore-backend-admin-yl2ffz
    rootDir: millimore-backend
    # --include=dev is required: Render sets NODE_ENV=production, under which npm
    # skips devDependencies — but both builds need them (nest CLI, typescript,
    # prisma CLI, ts-node, next). The final step builds the admin's static export
    # into admin/out, which the API server then serves at `/`.
    buildCommand: >-
      npm install --include=dev &&
      npm run prisma:generate &&
      npm run build &&
      npx prisma migrate deploy &&
      npm run db:seed &&
      cd admin && npm install --include=dev && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: v1
      # DB connection is injected from the managed Postgres below.
      - key: DATABASE_URL
        fromDatabase:
          name: millimore-db
          property: connectionString
      # Redis connection injected from the managed Key Value store below. With
      # this set, realtime (prices/portfolio/events) fans out across instances —
      # so scaling to >1 instance later "just works".
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: millimore-redis
          property: connectionString
      # Secrets Render generates once and keeps stable across deploys.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      # CryptoService hashes any string to a 32-byte AES key, so a generated
      # value is fine. Keep it stable — rotating it makes existing ciphertext
      # (encrypted credentials) undecryptable.
      - key: CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      # OTP in console mode: codes are logged + returned as `devCode` so the app
      # can log in without an SMS gateway. Swap to twilio/msg91 + OTP_PROVIDER_KEY
      # in the Render dashboard when you wire a real provider.
      - key: OTP_PROVIDER
        value: console
      - key: OTP_CODE_TTL_SECONDS
        value: '300'
      - key: OTP_CODE_LENGTH
        value: '6'
      # The mobile app (native, no browser origin) calls the API; the admin UI
      # is now same-origin so it needs no CORS. '*' keeps the app working; tighten
      # to real web origins later if you add browser clients.
      - key: CORS_ORIGINS
        value: '*'

  # Managed Redis (Render Key Value) — powers realtime fan-out at scale.
  - type: keyvalue
    name: millimore-redis
    plan: free
    ipAllowList: [] # [] = reachable only from your Render services (private)
    maxmemoryPolicy: noeviction

databases:
  - name: millimore-db
    plan: free
    databaseName: millimore
    user: millimore
