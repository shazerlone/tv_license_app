# Render Blueprint — deploys Millimore as a SINGLE service on the free tier:
# one web service serves BOTH the admin UI (at /) and the API (at /v1) from the
# same origin. Render reads this file from the repo root when you create a
# "New > Blueprint" from this GitHub repo.
#
# Free-tier notes:
#  - The service sleeps after ~15 min idle and cold-starts on the next request
#    (~30-60s). The keep-warm GitHub Action mitigates this.
#  - Free Postgres is time-limited by Render (expires ~30 days after creation);
#    upgrade the database plan before then to keep data.
#  - Redis is NOT provisioned yet — it gets added when the realtime milestones
#    (prices/portfolio/chat) land.
services:
  - type: web
    name: millimore-backend
    runtime: node
    plan: free
    branch: claude/millimore-backend-admin-yl2ffz
    rootDir: millimore-backend
    # --include=dev is required: Render sets NODE_ENV=production, under which npm
    # skips devDependencies — but both builds need them (nest CLI, typescript,
    # prisma CLI, ts-node, next). The final step builds the admin's static export
    # into admin/out, which the API server then serves at `/`.
    buildCommand: >-
      npm install --include=dev &&
      npm run prisma:generate &&
      npm run build &&
      npx prisma migrate deploy &&
      npm run db:seed &&
      cd admin && npm install --include=dev && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: v1
      # DB connection is injected from the managed Postgres below.
      - key: DATABASE_URL
        fromDatabase:
          name: millimore-db
          property: connectionString
      # Secrets Render generates once and keeps stable across deploys.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      # CryptoService hashes any string to a 32-byte AES key, so a generated
      # value is fine. Keep it stable — rotating it makes existing ciphertext
      # (encrypted credentials) undecryptable.
      - key: CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      # OTP in console mode: codes are logged + returned as `devCode` so the app
      # can log in without an SMS gateway. Swap to twilio/msg91 + OTP_PROVIDER_KEY
      # in the Render dashboard when you wire a real provider.
      - key: OTP_PROVIDER
        value: console
      - key: OTP_CODE_TTL_SECONDS
        value: '300'
      - key: OTP_CODE_LENGTH
        value: '6'
      # The mobile app (native, no browser origin) calls the API; the admin UI
      # is now same-origin so it needs no CORS. '*' keeps the app working; tighten
      # to real web origins later if you add browser clients.
      - key: CORS_ORIGINS
        value: '*'

databases:
  - name: millimore-db
    plan: free
    databaseName: millimore
    user: millimore
