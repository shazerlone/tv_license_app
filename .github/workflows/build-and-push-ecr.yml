# Builds the Millimore backend Docker image and pushes it to Amazon ECR — so you
# never need Docker or the AWS CLI on your machine. Runs on every push that
# touches backend/ (and via the manual "Run workflow" button). After it runs,
# roll it out: AWS Console → ECS → your service → Update (force new deployment,
# image = .../millimore-backend:latest).
#
# AWS keys already live in repo Settings → Secrets → Actions
# (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY) — nothing new to add.
name: build-and-push-ecr

on:
  push:
    branches: [monorepo, main]
    paths: ['backend/**', '.github/workflows/build-and-push-ecr.yml']
  workflow_dispatch: {}

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: millimore-backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}"
          docker build -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA}" backend
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA}"
          echo "## Image pushed to ECR" >> "$GITHUB_STEP_SUMMARY"
          echo "Now roll it out: ECS -> service -> Update -> Force new deployment" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE:latest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
