name: millimore
description: The Creator Economy for Traders
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  camera: ^0.11.0
  http: ^1.2.0
  shared_preferences: ^2.2.2
  web_socket_channel: ^2.4.5
  image_picker: ^1.1.2
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/

flutter_launcher_icons:
  image_path: "assets/icon/millimore_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  background_color_ios: "#0B1120"
